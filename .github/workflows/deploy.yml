name: Deploy to VPS

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy via SSH (Clone & Setup)
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            # Install git if missing
            apt-get update && apt-get install -y git
            
            # Resolve absolute path for ~/meta
            DEPLOY_DIR=$HOME/meta
            
            # Clone or pull the repository
            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              rm -rf "$DEPLOY_DIR"
              git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git "$DEPLOY_DIR"
            else
              cd "$DEPLOY_DIR"
              git fetch --all
              git reset --hard origin/main || git reset --hard origin/master
            fi
            
            cd "$DEPLOY_DIR"
            
            # Create .env file with secrets
            echo "META_ACCESS_TOKEN=${{ secrets.META_ACCESS_TOKEN }}" > .env
            
            # Create virtual environment if it doesn't exist
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            
            # Upgrade pip and install dependencies
            ./venv/bin/pip install --upgrade pip
            ./venv/bin/pip install -r requirements.txt
            
            # Copy systemd service file with dynamically updated paths
            sed "s|/var/www/meta|$DEPLOY_DIR|g" meta-api.service > /etc/systemd/system/meta-api.service
            
            # Reload systemd, enable and restart service
            systemctl daemon-reload
            systemctl enable meta-api.service
            systemctl restart meta-api.service
            
            # Install nginx, certbot, python3-certbot-nginx
            apt-get install -y nginx certbot python3-certbot-nginx
            
            # Setup Nginx configuration
            sed "s/DOMAIN_NAME/${{ secrets.DOMAIN_NAME }}/g" nginx.conf.template > /etc/nginx/sites-available/meta-api
            ln -sf /etc/nginx/sites-available/meta-api /etc/nginx/sites-enabled/
            rm -f /etc/nginx/sites-enabled/default
            
            # Reload Nginx
            nginx -t && systemctl reload nginx
            
            # Obtain SSL certificate using Certbot
            certbot --nginx -d ${{ secrets.DOMAIN_NAME }} --non-interactive --agree-tos -m ${{ secrets.EMAIL_FOR_SSL }} --redirect || true
