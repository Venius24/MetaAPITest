name: Deploy to VPS

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Copy files via SCP
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "main.py,requirements.txt,meta-api.service"
          target: "/var/www/meta-api"

      - name: Execute remote SSH commands
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/meta-api
            
            # Create .env file with secrets
            echo "META_ACCESS_TOKEN=${{ secrets.META_ACCESS_TOKEN }}" > .env
            
            # Create virtual environment if it doesn't exist
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            
            # Upgrade pip and install dependencies
            ./venv/bin/pip install --upgrade pip
            ./venv/bin/pip install -r requirements.txt
            
            # Copy systemd service file
            cp meta-api.service /etc/systemd/system/meta-api.service
            
            # Reload systemd, enable and restart service
            systemctl daemon-reload
            systemctl enable meta-api.service
            systemctl restart meta-api.service
